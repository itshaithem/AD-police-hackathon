<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>ScamShield</title>
<style>
  body { font: 13px/1.4 system-ui, sans-serif; width: 300px; margin: 0; padding: 0; background: #1a1f2e; color: #f2e9da; }
  header { padding: 12px 14px; border-bottom: 1px solid #333a4d; }
  h1 { font-size: 14px; margin: 0 0 2px; }
  .sub { opacity: .7; font-size: 12px; }
  .banner { margin: 10px 14px 0; padding: 8px 10px; border-radius: 6px; background: #3a2420; border: 1px solid #C8442F; font-size: 12px; }
  #list { padding: 0 14px; }
  .empty { opacity: .7; padding: 14px; }
  .item { border-left: 3px solid #555; padding: 8px 10px; margin: 8px 0; background: #222838; border-radius: 0 4px 4px 0; }
  .score { font-weight: 700; }
  .reason { opacity: .85; margin-top: 2px; font-size: 12px; }
  .controls { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-top: 1px solid #333a4d; }
  .controls label { font-size: 12px; display: flex; align-items: center; gap: 6px; }
  button { font: inherit; padding: 5px 10px; border-radius: 5px; border: 1px solid #556; background: #2a3042; color: #f2e9da; cursor: pointer; }
  a.opts { color: #9ab; font-size: 12px; display: block; padding: 0 14px 12px; }
</style>
</head>
<body>
  <header>
    <h1>ScamShield Link Scanner</h1>
    <div class="sub" id="summary">Scanning…</div>
  </header>
  <div id="banner"></div>
  <div id="list" class="empty">No suspicious links found yet.</div>
  <div class="controls">
    <label><input type="checkbox" id="pause"> Pause scanning</label>
    <button id="rescan">Rescan page</button>
  </div>
  <a class="opts" href="#" id="openOptions">Settings</a>
  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>

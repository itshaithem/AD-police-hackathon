<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>ScamShield Link Scanner — Settings</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; max-width: 420px; margin: 40px auto; color: #1a1f2e; }
  label { display: block; margin-top: 14px; font-weight: 600; }
  input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
  button { margin-top: 16px; padding: 8px 16px; cursor: pointer; }
  #status { margin-top: 10px; font-size: 13px; }
</style>
</head>
<body>
  <h1>ScamShield Link Scanner</h1>
  <p>Points this extension at your ScamShield backend. The API key is stored only in this browser.</p>
  <label for="apiBase">Backend URL</label>
  <input id="apiBase" placeholder="http://localhost:8000">
  <label for="apiKey">API key</label>
  <input id="apiKey" type="password" placeholder="matches the backend's API_KEY">
  <button id="save">Save</button>
  <div id="status"></div>
  <script src="options.js"></script>
</body>
</html>

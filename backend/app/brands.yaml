# Always-safe domains (extend with Tranco top sites for fewer false positives)
extra_allowlist: [google.com, gov.ae, youtube.com, wikipedia.org, github.com, linkedin.com, cloudflare.com, nbf.ae, hsbc.ae, citibank.ae, wio.io, liv.me,
                  ajmanbank.ae, sib.ae, adcbislamic.com, khaleejtimes.com, thenationalnews.com, gulfnews.com, wam.ae, dubai.ae, adgm.com, difc.ae]
allowlist_suffixes: [".gov.ae"]          # any *.gov.ae is official

suspicious_tlds: [xyz, top, icu, shop, online, click, live, cfd, sbs, info, buzz, rest, monster, lol, support, help, site, website, cyou]
free_hosts: [vercel.app, netlify.app, github.io, pages.dev, web.app, firebaseapp.com, weebly.com, wixsite.com, 000webhostapp.com, glitch.me, blogspot.com, sites.google.com, workers.dev, onrender.com,
             framer.app, framer.website, webflow.io, backblazeb2.com, r2.dev, ipfs.io, dweb.link, square.site, godaddysites.com, mystrikingly.com, yolasite.com,
             jimdosite.com, carrd.co, notion.site, replit.app, repl.co, surge.sh, herokuapp.com, azurewebsites.net, blob.core.windows.net,
             storage.googleapis.com, s3.amazonaws.com, ngrok-free.app, ngrok.io, trycloudflare.com, wordpress.com, myshopify.com, gitbook.io, typedream.app, start.page, railway.app, fly.dev, deno.dev, pythonanywhere.com]
# Domain marketplaces / parking: a look-alike that lands here is parked or for sale, not an active scam (yet).
parking_hosts: [afternic.com, godaddy.com, sedo.com, dan.com, hugedomains.com, bodis.com, parkingcrew.net, sav.com, undeveloped.com, atom.com, squadhelp.com, porkbun.com, namecheap.com, spaceship.com, above.com]
shorteners: [bit.ly, tinyurl.com, t.co, rebrand.ly, cutt.ly, is.gd, s.id, shorturl.at, rb.gy, t.ly, ow.ly, goo.su]
urgency_keywords:
  en: [urgent, suspended, blocked, verify your, update your, final notice, unpaid, fine, penalty, expire, within 24 hours, refund, prize]
  ar: [عاجل, مخالفة, غرامة, سيتم إيقاف, تم إيقاف, تحديث بياناتك, تحديث البيانات, إشعار نهائي, مستحقات, استرداد, جائزة, خلال 24 ساعة, تحقق]

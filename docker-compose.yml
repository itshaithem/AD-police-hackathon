services:
  backend:
    build: ./backend
    env_file: .env
    ports: ["8000:8000"]
    volumes: ["./data:/data"]
    depends_on: [sandbox]
    networks: [internal, egress]

  sandbox:
    build: ./sandbox
    read_only: true
    tmpfs: ["/tmp:size=512m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    cpus: 1.5
    pids_limit: 300
    environment: [HOME=/tmp]
    networks:
      internal: {}
      egress: {}
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    volumes: ["ollama:/root/.ollama"]
    networks: [internal]
    profiles: ["llm"]           # docker compose --profile llm up

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
        VITE_API_KEY: ${API_KEY:-change-me}
    ports: ["8080:80"]

  demo-sites:                    # LOCAL ONLY — never expose publicly
    image: nginx:alpine
    volumes: ["./demo-sites:/sites:ro", "./demo-sites/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    networks:
      egress:
        aliases: [saqrbank.test, saqrbank-secure-login.test, saqr-bank-verify.test]

networks:
  internal: { internal: true }   # no internet; backend <-> sandbox <-> ollama
  egress: {}                     # internet access

volumes:
  ollama: {}

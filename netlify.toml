# Netlify (lite mode). Set ANTHROPIC_API_KEY in the Netlify UI (Site configuration → Environment variables).
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  VITE_API_URL = "lite"
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

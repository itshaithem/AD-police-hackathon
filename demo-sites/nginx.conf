# LOCAL ONLY. Serves fictional demo sites by Host header inside the docker network.
server {
  listen 80 default_server;
  root /sites/$host;
  index index.html;
  # Short-link style redirect to show redirect handling: saqrbank.test/r/abc -> look-alike
  location = /r/abc { return 302 http://saqrbank-secure-login.test/; }
  location / { try_files $uri $uri/ =404; }
}

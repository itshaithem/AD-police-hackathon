<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Saqr Bank — Online Banking</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#f4f6f8;color:#14213d}
header{background:#0b3d5c;color:#fff;padding:18px 20px;font-weight:700;letter-spacing:.08em}
main{max-width:380px;margin:40px auto;background:#fff;border-radius:12px;padding:28px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
h1{font-size:20px;margin:0 0 18px}label{display:block;font-size:13px;margin:12px 0 4px}
input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #c9d2da;border-radius:8px;font-size:15px}
button{margin-top:20px;width:100%;padding:13px;border:0;border-radius:8px;background:#0b3d5c;color:#fff;font-size:15px}
footer{text-align:center;font-size:12px;color:#888;margin:30px 0}
</style></head>
<body>
<header>SAQR BANK · بنك صقر</header>
<main>
  <h1>Sign in to Online Banking</h1>
  <form onsubmit="return false">
    <label for="u">Username</label><input id="u" name="username" autocomplete="username">
    <label for="p">Password</label><input id="p" name="password" type="password" autocomplete="current-password">
    <button type="submit">Sign in</button>
  </form>
</main>
<footer>ScamShield TEST PAGE — fictional brand for demonstration only</footer>

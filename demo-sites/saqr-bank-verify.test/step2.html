<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Saqr Bank — Verify card</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#f4f6f8;color:#14213d}
header{background:#0b3d5c;color:#fff;padding:18px 20px;font-weight:700;letter-spacing:.08em}
main{max-width:380px;margin:40px auto;background:#fff;border-radius:12px;padding:28px}
label{display:block;font-size:13px;margin:12px 0 4px}
input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #c9d2da;border-radius:8px;font-size:15px}
button{margin-top:20px;width:100%;padding:13px;border:0;border-radius:8px;background:#0b3d5c;color:#fff;font-size:15px}
footer{text-align:center;font-size:12px;color:#888;margin:30px 0}
</style></head>
<body>
<header>SAQR BANK · بنك صقر</header>
<main>
  <h1 style="font-size:18px">تأكيد البطاقة / Verify your card</h1>
  <form onsubmit="document.body.innerHTML='<main><h1>شكراً — Thank you</h1></main>';return false">
    <label for="c">رقم البطاقة / Card number</label><input id="c" name="card_number" autocomplete="cc-number" inputmode="numeric">
    <label for="e">تاريخ الانتهاء / Expiry</label><input id="e" name="exp" placeholder="MM/YY">
    <label for="v">CVV</label><input id="v" name="cvv" maxlength="4">
    <label for="o">رمز التحقق / OTP</label><input id="o" name="otp" maxlength="6">
    <button type="submit">Confirm / تأكيد</button>
  </form>
</main>
<footer>ScamShield TEST PAGE — fictional brand for demonstration only</footer>
</body></html>
